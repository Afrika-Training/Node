name: Veracode Connect

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Veracode Connect
        id: connect
        uses: Afrika-Tecnologia/Veracode-Connect@e2e/sca-baseline
        with:
          veracode_api_id: ${{ secrets.VERACODE_API_ID }}
          veracode_api_key: ${{ secrets.VERACODE_API_KEY }}
          veracode_sca_token: ${{ secrets.VERACODE_SCA_TOKEN }}
          veracode_appname: ${{ github.repository_owner }}-${{ github.event.repository.name }}

          baseline_mode: 'repo'
          baseline_org: ${{ github.repository_owner }}
          baseline_github_app_id: ${{ secrets.BASELINE_GITHUB_APP_ID }}
          baseline_github_app_private_key: ${{ secrets.BASELINE_GITHUB_APP_PRIVATE_KEY }}
          baseline_github_app_installation_id: ${{ secrets.BASELINE_GITHUB_APP_INSTALLATION_ID }}

          enable_auto_packager: 'true'
          enable_pipelinescan: 'true'
          enable_sca: 'true'
          enable_iac: 'true'
          enable_upload_scan: 'false'

          iac_policy: 'Container IaC Policy - N2'
          enable_iac_baseline: 'true'
          enable_sca_baseline: 'true'
          sca_fail_on_severity: 'Very High, High'

          policy_fail: 'true'
          fail_on_cve: 'CVE-2019-10744'
          fail_on_severity: 'Very High, High'
          fail_build: 'true'

          comment_pr: 'true'
          create_issues: 'false'

      - name: Resultado do baseline IaC
        if: always()
        env:
          IAC_STATUS: ${{ steps.connect.outputs.iac_status }}
          IAC_POLICY_STATUS: ${{ steps.connect.outputs.iac_policy_status }}
          IAC_BASELINE_STATUS: ${{ steps.connect.outputs.iac_baseline_status }}
          HAS_IAC_BASELINE: ${{ steps.connect.outputs.has_iac_baseline }}
          IAC_NEW_POLICY_COUNT: ${{ steps.connect.outputs.iac_new_policy_count }}
          PIPELINE_STATUS: ${{ steps.connect.outputs.pipeline_status }}
          SCA_STATUS: ${{ steps.connect.outputs.sca_status }}
          SCA_CVE_BLOCKED: ${{ steps.connect.outputs.cve_blocked_count }}
          SCA_BASELINE_STATUS: ${{ steps.connect.outputs.sca_baseline_status }}
          HAS_SCA_BASELINE: ${{ steps.connect.outputs.has_sca_baseline }}
          SCA_NEW_POLICY_COUNT: ${{ steps.connect.outputs.sca_new_policy_count }}
        run: |
          echo "iac_status=${IAC_STATUS}"
          echo "iac_policy_status=${IAC_POLICY_STATUS}"
          echo "iac_baseline_status=${IAC_BASELINE_STATUS}"
          echo "has_iac_baseline=${HAS_IAC_BASELINE}"
          echo "iac_new_policy_count=${IAC_NEW_POLICY_COUNT}"
          echo "pipeline_status=${PIPELINE_STATUS}"
          echo "sca_status=${SCA_STATUS}"
          echo "cve_blocked_count=${SCA_CVE_BLOCKED}"
          echo "sca_baseline_status=${SCA_BASELINE_STATUS}"
          echo "has_sca_baseline=${HAS_SCA_BASELINE}"
          echo "sca_new_policy_count=${SCA_NEW_POLICY_COUNT}"
